name: Build & Deploy (Jekyll → S3)

on:
  push:
    branches: [ master ]
    paths:
      - "**/*.md"
      - "**/*.html"
      - "**/*.yml"
      - "assets/**"
      - "_assets/**"
      - "_docs/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "_posts/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "s3_website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-learn-mearm
  cancel-in-progress: true

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest

    env:
      JEKYLL_ENV: production
      # Build Nokogiri against the system libxml2/libxslt installed below
      BUNDLE_BUILD__NOKOGIRI: --use-system-libraries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries for native gems
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev libffi-dev

      # jekyll-assets 3.x does not run on Ruby 3, so stay on 2.7.
      # Gems come from the committed Gemfile.lock (Bundler 2.4.22).
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --destination _site

      - name: HTML proof (internal links)
        run: >
          bundle exec htmlproofer ./_site
          --disable-external
          --alt-ignore "/.*/"
          --allow-hash-href
          --url-ignore "/#.*=.*/"

      # s3_website runs a Java jar that only works on Java 8
      - name: Setup Java 8 for s3_website
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Deploy to S3 (s3_website)
        if: github.ref == 'refs/heads/master'
        env:
          S3ID: ${{ secrets.S3ID }}
          S3SECRET: ${{ secrets.S3SECRET }}
        run: bundle exec s3_website push
